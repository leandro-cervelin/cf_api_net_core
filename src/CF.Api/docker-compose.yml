services:
  api:
    build:
      context: ..
      dockerfile: CF.Api/Dockerfile
      target: final
    ports:
      - "8888:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DbConnection=Data Source=db;Initial Catalog=CF;User ID=sa;Password=${SA_PASSWORD};Trusted_Connection=False;TrustServerCertificate=True;
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
    depends_on:
      # Start only once the schema is up to date.
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-network

  # One-shot: applies pending EF Core migrations with the bundle, then exits.
  migrate:
    build:
      context: ..
      dockerfile: CF.Api/Dockerfile
      target: migrator
    environment:
      - ConnectionStrings__DbConnection=Data Source=db;Initial Catalog=CF;User ID=sa;Password=${SA_PASSWORD};Trusted_Connection=False;TrustServerCertificate=True;
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mssql-data:

networks:
  app-network:
    driver: bridge
